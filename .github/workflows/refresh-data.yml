name: Refresh FPL price snapshot

on:
  schedule:
    # Every 3 hours. FPL prices only actually change once a day (overnight),
    # but polling more often catches the move sooner and gives us a denser
    # history for the risers/fallers "since last check" numbers.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest FPL data
        run: npm run refresh

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data/; then
            echo "No price changes since last snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: refresh FPL price snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
